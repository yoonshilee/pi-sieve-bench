name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-sieve-bench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: pi-sieve-bench
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yoonshilee/pi-sieve
          ref: 7388f9ffc7c9483a2e4b85efd8e463874142e75a
          path: pi-sieve
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: pi-sieve-bench/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: pi-sieve
      - run: python -m pip install -r requirements.txt
      - run: npm run check
      - run: node scripts/check-privacy.mjs --history
      - name: Verify saved report generation
        run: |
          for batch in reports/*/manifest.json; do
            [ -f "$batch" ] || continue
            BENCH_PYTHON=python npm run report -- "$(basename "$(dirname "$batch")")"
          done
      - name: Scan complete history
        run: |
          scanner_dir="$RUNNER_TEMP/sieve-gitleaks"
          mkdir -p "$scanner_dir"
          curl -fsSL 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' -o "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --log-opts=--all --redact --no-banner --log-level error .
